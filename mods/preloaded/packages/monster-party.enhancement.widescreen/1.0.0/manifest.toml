format_version = 1
id = "monster-party.enhancement.widescreen"
version = "1.0.0"
name = "Monster Party Adaptive Widescreen"
author = "NESRecomp"
description = "See more of each stage with adaptive widescreen. Enemies fill the wider view while the life bar and boss rooms stay centered."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "custom"

[[target]]
game_id = "monster-party-usa"
rom_crc32 = "02b9e7c2"

[[feature]]
id = "widescreen"
name = "Adaptive Widescreen"
description = "Show more of each scrolling area, with enemies active across the wider view and the camera stopped at level edges. The HUD and boss rooms stay centered."
group = "Display"
exclusive_group = "display-mode"
default_enabled = false

[[plugin]]
feature = "widescreen"
id = "monster-party.widescreen"

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect"
type = "choice"
default = "fit"
[[option.choice]]
value = "fit"
label = "Fit window (adaptive)"
[[option.choice]]
value = "16-9"
label = "16:9"
[[option.choice]]
value = "21-9"
label = "21:9"
[[option.choice]]
value = "32-9"
label = "32:9"
